name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: CLI smoke test
        run: forge --help
      - name: Fast quality gate
        run: python -m tools.quality_gate

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Run complete suite
        run: pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build source and wheel distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: forge-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  installation:
    name: Install (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.mode }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        mode: [venv, pipx]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: forge-distributions
          path: dist/
      - name: Install pipx for the isolated pipx cell
        if: matrix.mode == 'pipx'
        run: python -m pip install --upgrade pip pipx
      - name: Exercise exact built wheel
        run: >-
          python -m tools.distribution_smoke
          --wheel dist/forge_governance-1.0.0-py3-none-any.whl
          --mode ${{ matrix.mode }}

  release-scenarios:
    name: Release scenarios (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: forge-distributions
          path: dist/
      - name: Install exact built wheel
        run: >-
          python -m pip install --upgrade pip
          dist/forge_governance-1.0.0-py3-none-any.whl
      - name: Enforce performance budgets
        run: python -m tools.performance_review
      - name: Complete both fresh-user examples
        if: matrix.python == '3.12'
        run: python -m tools.example_workflow_smoke --example all
      - name: Rehearse backup, migration, recovery, abandonment, and succession
        if: matrix.python == '3.12'
        run: python -m tools.release_procedure_rehearsal
